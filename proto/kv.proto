// 文件用途：KV 数据面契约——Raw API（M1，SPEC-1）与事务 API（M5，SPEC-4）骨架。
// 归属：TinyKV-CPP（M0 基建；契约变更须先与用户核对，CLAUDE.md §15）。
// 通用约定：key/value 一律 bytes（编码层见 src/common/encode.h，传输不解释内容）；
//   ts 为 uint64 时间戳（物理值 Ms 逻辑钟，比较序 = 数值序）；错误见 RegionError。

syntax = "proto3";

package tinykv.kvpb;

import "common.proto";
import "raft_cmdpb.proto";

// 列族与 region 世代复用 common.proto（M2-0 契约统一：禁止本文件另立同义类型）

// ---------- Raw API（M1） ----------

message RawGetRequest {
    bytes key = 1;        // 必填：非空（空 key 由服务端拒绝 InvalidArgument）
    tinykv.commonpb.CfName cf = 2;        // 可空：缺省 = CF_DEFAULT
}
message RawGetResponse {
    bytes value = 1;      // 可空：key 不存在时 not set（存在性用 found 区分）
    bool found = 2;       // key 是否存在（区别"空值"与"无值"）
    tinykv.cmdpb.RegionError region_error = 3;  // 可空：region 级失败时其余字段不可信
}

message RawPutRequest {
    bytes key = 1;        // 必填：非空
    bytes value = 2;      // 必填：可空字节串（空 value 合法，与删除区分）
    tinykv.commonpb.CfName cf = 3;
    uint64 ttl = 4;       // 秒；0 = 永不过期（M1 预留，服务端当前忽略）
}
message RawPutResponse {
    tinykv.cmdpb.RegionError region_error = 1;  // 可空
}

message RawDeleteRequest {
    bytes key = 1;        // 必填：非空；删除不存在的 key 视为成功（幂等）
    tinykv.commonpb.CfName cf = 2;
}
message RawDeleteResponse {
    tinykv.cmdpb.RegionError region_error = 1;
}

message RawScanRequest {
    bytes start_key = 1;  // 扫描起点（含）；空 = CF 起始
    uint32 limit = 2;     // 必填：本页最大返回条数（>0；服务端据此截断）
    tinykv.commonpb.CfName cf = 3;
    bool key_only = 4;    // true 时不返回 value（省带宽）
}
message RawScanResponse {
    message Pair {
        bytes key = 1;
        bytes value = 2;  // key_only=true 时 not set
    }
    repeated Pair pairs = 1;       // 字节序升序（编码保证）；可为空（无数据）
    bytes end_key = 2;             // 可空：本页截断处（续扫游标；未截断时 not set）
    tinykv.cmdpb.RegionError region_error = 3;
}

// ---------- 事务 API（M5，Percolator SI） ----------

message TxnGetRequest {
    bytes key = 1;              // 必填：非空
    uint64 start_ts = 2;        // 事务开始时间戳（TSO 分配）
}
message TxnGetResponse {
    bytes value = 1;            // 可空：SI 快照内不可见或不存在时 not set
    bool found = 2;
    tinykv.cmdpb.RegionError region_error = 3;
}

message Mutation {
    enum Op {
        PUT = 0;
        DELETE = 1;
    }
    Op op = 1;
    bytes key = 2;              // 必填：非空
    bytes value = 3;            // op=PUT 时必填（可空字节串）；op=DELETE 时忽略
}

message TxnPrewriteRequest {
    repeated Mutation mutations = 1;  // 必填：非空（批量一等公民；≥1 条）
    bytes primary_lock = 2;           // 必填：主锁 key（mutations 之一；提交/回滚的锚点）
    uint64 start_ts = 3;
    uint64 lock_ttl = 4;              // 毫秒：锁存活时长
    // 加锁时刻（毫秒，与 check_txn_status 的 now_ms 同一口径）。缺省 0 = 旧客户端未携带，
    // 服务端按 0 处理（锁会被判为早已过期）——这是向后兼容的退化路径，不是正确路径。
    // 为什么必须随请求传：TTL 判定需要"锁出生的时刻"，服务端本地时钟猜不出客户端何时加锁，
    // 用 0 当出生时刻会让运行超过 TTL 的进程把所有新锁判成过期（ARCH-1 P0-2）。
    uint64 created_ms = 5;
    // 跨区事务标记（M7 ⑦）：true 表示"本批只是该事务的一个分区组，primary 可能在别的 region"。
    // 服务端据此放宽"primary 必须在本批内"的校验——单区路径必须保持 false，否则决议锚点失去守护。
    bool cross_region = 6;
}
message TxnPrewriteResponse {
    repeated bytes already_exist_keys = 1;  // 与既有锁冲突且不可覆盖的 key；可为空
    tinykv.cmdpb.RegionError region_error = 2;
}

message TxnCommitRequest {
    repeated bytes keys = 1;    // 必填：非空（含 primary）
    uint64 start_ts = 2;
    uint64 commit_ts = 3;       // 必须 > start_ts（服务端校验）
}
message TxnCommitResponse {
    tinykv.cmdpb.RegionError region_error = 1;
}

message TxnBatchRollbackRequest {
    repeated bytes keys = 1;    // 必填：非空（含 primary）
    uint64 start_ts = 2;
}
message TxnBatchRollbackResponse {
    tinykv.cmdpb.RegionError region_error = 1;
}

message TxnCheckTxnStatusRequest {
    bytes primary_key = 1;      // 必填：主锁 key
    uint64 lock_start_ts = 2;   // 被查事务的 start_ts
    uint64 caller_start_ts = 3; // 发起查询的事务 start_ts（锁过期回滚判定边界）
}
message TxnCheckTxnStatusResponse {
    uint64 commit_ts = 1;       // 已提交时非 0；未提交/已回滚 = 0
    uint64 lock_ttl = 2;        // 未过期时剩余 TTL（毫秒）；过期/已终态 = 0
    tinykv.cmdpb.RegionError region_error = 3;
}

message TxnGCRequest {
    uint64 safe_point = 1;      // 全集群最小活跃 start_ts（M6：daemon 取活跃会话最小值）
}
message TxnGCResponse {
    uint64 versions_removed = 1;   // 清理的 Write 版本数
    uint64 data_removed = 2;       // 清理的 Default 条目数
}
